# Command-line autoplay mode: no web server, quiet logs, play N games and exit.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.ponomarenko.mugloar=info

mugloar.autoplay.games=1
mugloar.autoplay.target-score=1000
# A well-upgraded dragon can go on for hundreds of turns: mugloar.strategy.max-turns (default 1000) stops a game after that many
# actions and the server keeps the score. Lower it for quicker benchmark runs, e.g. --mugloar.strategy.max-turns=500
