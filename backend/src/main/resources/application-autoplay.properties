# Command-line autoplay mode: no web server, quiet logs, play N games and exit.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.ponomarenko.mugloar=info

mugloar.autoplay.games=1
mugloar.autoplay.target-score=1000
# A well-upgraded dragon never dies; stop a game after this many actions (the server keeps the score)
mugloar.autoplay.max-turns=1000
