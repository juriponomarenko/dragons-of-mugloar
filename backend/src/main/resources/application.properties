spring.application.name=mugloar-backend
server.port=8080

# Dragons of Mugloar game API
mugloar.api.base-url=https://dragonsofmugloar.com/api/v2
mugloar.api.user-agent=mugloar-backend/1.0
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=20s

# Strategy defaults live in StrategyProperties; override here to experiment, e.g.
# mugloar.strategy.potion-lives-threshold=3

management.endpoints.web.exposure.include=health,info
