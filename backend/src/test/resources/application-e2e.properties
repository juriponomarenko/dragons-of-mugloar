# The backend behind the frontend's Playwright tests (E2eBackend, started by spring-boot:test-run).
# A port of its own, so a backend already running on 8080 is left alone; frontend/playwright.config.ts
# expects this one.
server.port=8081
# Keeps "Finish game" short: a server-side run stops after this many actions.
mugloar.strategy.max-turns=15
